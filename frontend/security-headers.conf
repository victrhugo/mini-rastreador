# Cabeçalhos de segurança das páginas do front (incluído em cada location do nginx.conf).
# O hash em script-src é o do script de tema embutido no index.html; um teste do front
# (src/csp.test.ts) falha se o script mudar sem atualizar este hash.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-WJyYk34hapxQTY7QzOUgvPGeyn0xCiUwk78qpRDWmQ8='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
