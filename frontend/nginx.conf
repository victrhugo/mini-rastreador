# Porta que o navegador usou (ex.: 3000 em localhost:3000), repassada à API.
map $http_host $forwarded_port {
    ~:(?<port>\d+)$ $port;
    default 80;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # JS, CSS, JSON e SVG comprimidos. text/event-stream (SSE) fica de fora de propósito.
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # A API fica atrás do mesmo host: o navegador enxerga uma única origem (sem CORS).
    location /api/ {
        proxy_pass http://backend:8080;
        # Host e porta reais: a API reconhece a página (ex.: localhost:3000) como mesma
        # origem. Sem isso o Tomcat assume a porta 80 e responde 403 de CORS ao navegador.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        # Sobrescreve (não acrescenta) o IP do cliente: um X-Forwarded-For forjado pelo
        # navegador não chega à API, então o limite de login usa o IP real.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Eventos em tempo real (SSE): sem buffer e com conexão longa.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Assets com hash no nome podem ficar em cache por muito tempo.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # O index.html nunca fica em cache: depois de um deploy, o navegador busca os assets novos.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # SPA: qualquer rota desconhecida cai no index.html (React Router resolve).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
