server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # A API fica atrás do mesmo host: o navegador enxerga uma única origem (sem CORS).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Eventos em tempo real (SSE): sem buffer e com conexão longa.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Assets com hash no nome podem ficar em cache por muito tempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: qualquer rota desconhecida cai no index.html (React Router resolve).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
