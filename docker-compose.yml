services:
  backend:
    build: ./backend
    environment:
      # Sem valor, a API gera uma chave aleatória a cada inicialização (nenhum segredo fica no repositório).
      # Em produção, defina antes do compose up: export JWT_SECRET="$(openssl rand -base64 48)"
      JWT_SECRET: ${JWT_SECRET:-}
      DB_PATH: /data/rastreador.db
    volumes:
      - db-data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
