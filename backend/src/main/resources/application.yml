spring:
  application:
    name: mini-rastreador-api

  datasource:
    url: jdbc:sqlite:${DB_PATH:./data/rastreador.db}?foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite aceita apenas um escritor por vez; uma conexão evita SQLITE_BUSY.
      maximum-pool-size: 1

  jpa:
    open-in-view: false
    hibernate:
      # Flyway é a fonte do schema. "validate" não serve no SQLite: chaves autoincremento
      # precisam ser INTEGER, e o Hibernate espera BIGINT para campos Long.
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  # Atrás do nginx (Docker), usa o IP real do cliente (X-Forwarded-For) no limite de login.
  forward-headers-strategy: native

app:
  jwt:
    # Valor padrão serve só para desenvolvimento local. Em qualquer outro ambiente, defina JWT_SECRET.
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32bytes!}
    expiration: ${JWT_EXPIRATION:2h}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  email:
    # Confere no DNS se o domínio do e-mail recebe mensagens (sem API externa).
    check-domain: ${EMAIL_CHECK_DOMAIN:true}
    dns-timeout: 2s
  sla:
    # Tempo máximo esperado em cada etapa; passou disso, o pedido aparece como atrasado.
    limits:
      RECEBIDO: 10m
      EM_PREPARO: 30m
      SAIU_PARA_ENTREGA: 45m
  login:
    max-attempts: 5
    lock-duration: 15m
  cep:
    # ViaCEP é a fonte principal; a BrasilAPI só é usada se a ViaCEP falhar ou demorar.
    via-cep-url: ${VIACEP_URL:https://viacep.com.br/ws}
    brasil-api-url: ${BRASILAPI_URL:https://brasilapi.com.br/api/cep/v1}
    timeout: ${CEP_TIMEOUT:3s}
