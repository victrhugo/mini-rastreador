spring:
  application:
    name: mini-rastreador-api

  datasource:
    url: jdbc:sqlite:${DB_PATH:./data/rastreador.db}?foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      # SQLite aceita apenas um escritor por vez; uma conexão evita SQLITE_BUSY.
      maximum-pool-size: 1

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
